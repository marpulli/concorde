[package]
name = "concorde"
version = "0.1.0"
edition = "2024"

[lib]
name = "_concorde"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.27.0"
ordered-float = "5.1.0"
pyo3 = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
toml = "0.8"
uuid = { version = "1.23.0", features = ["v7"] }
