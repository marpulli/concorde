# Default catalog, sourced from Pint 0.26.1 default_en.txt and the backend's
# backend/domain/units.py.
# SI bases are registered first. Definitions below are dependency-ordered.
# Prefixes are generated by the registry, never enumerated here.

# Derived SI units
[[unit]]
name = "N"
unit = "kg * m / s^2"
aliases = ["newton", "newtons"]

[[unit]]
name = "J"
unit = "N * m"
aliases = ["joule", "joules"]

[[unit]]
name = "W"
unit = "J / s"
aliases = ["watt", "watts"]

[[unit]]
name = "Pa"
unit = "N / m^2"
aliases = ["pascal", "pascals"]

[[unit]]
name = "V"
unit = "W / A"
aliases = ["volt", "volts"]

[[unit]]
name = "S"
unit = "A / V"
aliases = ["siemens", "mho"]

[[unit]]
name = "Bq"
unit = "1 / s"
aliases = ["becquerel", "becquerels"]

[[unit]]
name = "Sv"
unit = "J / kg"
aliases = ["sievert", "sieverts"]

[[unit]]
name = "bar"
unit = "Pa"
scale = 100000.0

# Conventional water density (1000 kg/m³) and standard gravity (9.80665 m/s²),
# matching Pint's inch_H2O rather than its temperature-specific variants.
[[unit]]
name = "inch_H2O"
unit = "Pa"
scale = 249.08891
aliases = ["inH2O", "in_H2O", "inchesH2O", "inches_H2O"]

# Time and energy (kWh, megawatt_hour, etc. use the Wh root)
[[unit]]
name = "min"
unit = "s"
scale = 60.0
aliases = ["minute", "minutes"]

[[unit]]
name = "hr"
unit = "s"
scale = 3600.0
aliases = ["h", "hour", "hours"]

[[unit]]
name = "day"
unit = "hr"
scale = 24.0
aliases = ["d", "days"]

# Keep the existing 'a' alias for are; use yr for the Julian year.
[[unit]]
name = "year"
unit = "day"
scale = 365.25
aliases = ["yr", "years", "julian_year"]

[[unit]]
name = "Wh"
unit = "W * hr"
aliases = ["watt_hour", "watthour"]

# Length, area and volume
[[unit]]
name = "inch"
unit = "m"
scale = 0.0254
aliases = ["in", "inches", "international_inch", "international_inches"]

# Exact 'ft' must win over femto + t (metric ton).
[[unit]]
name = "foot"
unit = "inch"
scale = 12.0
aliases = ["ft", "feet", "international_foot", "international_feet"]

[[unit]]
name = "mile"
unit = "m"
scale = 1609.344
aliases = ["mi", "miles", "international_mile"]

[[unit]]
name = "are"
unit = "m^2"
scale = 100.0
aliases = ["a"]

# Pint's hectare spelling is not simply hecto + are.
[[unit]]
name = "hectare"
unit = "are"
scale = 100.0
aliases = ["ha", "hectares"]

# Pint uses US survey feet for acres, not international feet.
[[unit]]
name = "acre"
unit = "m^2"
scale = 4046.8726098742513
aliases = ["acres"]

[[unit]]
name = "L"
unit = "m^3"
scale = 0.001
aliases = ["liter", "liters", "litre", "litres", "l", "ℓ"]

# US liquid gallon, not the imperial gallon.
[[unit]]
name = "gallon"
unit = "m^3"
scale = 0.003785411784
aliases = ["gal", "gallons", "liquid_gallon", "US_liquid_gallon"]

# Mass
[[unit]]
name = "metric_ton"
unit = "kg"
scale = 1000.0
aliases = ["t", "tonne", "tonnes", "metric_tons"]

[[unit]]
name = "pound"
unit = "kg"
scale = 0.45359237
aliases = ["lb", "pounds", "avoirdupois_pound", "avdp_pound"]

# Dimensionless scales and angle
[[unit]]
name = "rad"
unit = "1"
aliases = ["radian", "radians"]

[[unit]]
name = "degree"
unit = "rad"
scale = 0.017453292519943295
aliases = ["deg", "degrees", "arcdeg", "arcdegree", "angular_degree"]

[[unit]]
name = "%"
unit = "1"
scale = 0.01
aliases = ["percent"]

[[unit]]
name = "ppm"
unit = "1"
scale = 0.000001
aliases = ["parts_per_million"]

# Backend definitions required by persisted datapoints. These retain the
# backend's dimensional semantics (CO2e is mass; USD is dimensionless).
[[unit]]
name = "USD"
unit = "1"

# Deliberately preserve the backend's rounded factor, not Pint's short_ton.
[[unit]]
name = "short_ton_2"
unit = "kg"
scale = 907.185
aliases = ["st"]

[[unit]]
name = "gCO2e"
unit = "g"
aliases = ["gram_carbon_dioxide_equivalent"]

[[unit]]
name = "tCO2e"
unit = "metric_ton"
aliases = ["metric_ton_carbon_dioxide_equivalent"]

[[unit]]
name = "gram_carbon"
unit = "g"
aliases = ["gC"]

[[unit]]
name = "metric_ton_carbon"
unit = "metric_ton"
aliases = ["tC"]

[[unit]]
name = "metric_ton_hydroxide"
unit = "metric_ton"
aliases = ["tOH", "metric_ton_OH", "tonne_hydroxide", "tonne_OH"]

[[unit]]
name = "gOH"
unit = "g"
aliases = ["gram_hydroxide"]

[[unit]]
name = "molCO2e"
unit = "mol"
aliases = ["mole_carbon_dioxide_equivalent"]

[[unit]]
name = "mole_carbon"
unit = "mol"
aliases = ["molC"]

[[unit]]
name = "molc"
unit = "mol"
aliases = ["mole_charge"]

[[unit]]
name = "equiv"
unit = "mol"
aliases = ["equivalent", "Eq", "eq"]

[[unit]]
name = "teu"
unit = "m^3"
scale = 33.2
aliases = ["twenty_foot_equivalent_unit", "TEU"]

# Offsets are in kelvin: base = value * scale + offset.
# Registration also creates delta_ names and aliases, with scale only.
[[unit]]
name = "degree_Celsius"
unit = "K"
offset = 273.15
aliases = ["degC", "celsius"]

[[unit]]
name = "degree_Fahrenheit"
unit = "K"
scale = 0.5555555555555556
offset = 255.3722222222222
aliases = ["degF", "fahrenheit"]
